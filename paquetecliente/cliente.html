<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista Cliente - Seguimiento</title>
    <!-- Leaflet (mapa): los estilos van en el head -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        table, th, td { border: 1px solid black; }
    </style>
</head>
<body>
    <!-- ============ ① LO QUE SE VE ============ -->
    <!-- Esta página SOLO escucha: no tiene botones, no hace invoke -->

    <h1>Rastreo de tu Paquete</h1>
    <p id="infoPaquete"><b>Esperando a que se registre un nuevo envío...</b></p>

    <!-- el mapa NECESITA un alto, si no, no se ve -->
    <div id="mapaSeguimiento" style="height: 500px;"></div>

    <h3>Historial del Recorrido</h3>
    <table>
        <tr>
            <th>Ubicación</th>
            <th>Coordenadas (Lat, Lng)</th>
            <th>Estado</th>
        </tr>
        <tbody id="cuerpoTabla"></tbody>
    </table>

    <!-- ============ ② LA LIBRERÍA ============ -->
    <script src="signalr.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ============ ③ AGARRAR LOS ELEMENTOS (por su id) ============
        const infoPaquete = document.getElementById("infoPaquete");
        const cuerpoTabla = document.getElementById("cuerpoTabla");

        // variables: let porque van a cambiar
        let rutaCoordenadas = [];   // los puntos de la ruta: [[lat, lng], [lat, lng], ...]
        let lineaRuta = null;       // la línea azul
        let contadorParadas = 0;

        // crear el mapa, centrado en Teziutlán: [latitud, longitud], zoom
        const mapSeg = L.map("mapaSeguimiento").setView([19.8835847, -97.3934342], 13);

        // los "dibujos" del mapa (calles, ríos...). Sin esto se ve gris
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19
        }).addTo(mapSeg);

        // Dibujar (o volver a dibujar) la línea azul de la ruta
        function actualizarLinea() {
            if (lineaRuta != null) {
                lineaRuta.remove();
            }
            lineaRuta = L.polyline(rutaCoordenadas, { color: "blue" }).addTo(mapSeg);
        }

        // Agregar una fila a la tabla (igual que el <p> del chat, pero con <tr>). toFixed(5) = 5 decimales
        function agregarFilaTabla(lugar, lat, lng, estado) {
            let color = "black";
            if (estado == "Entregado") {
                color = "green";
            }
            const tr = document.createElement("tr");
            tr.innerHTML = "<td>" + lugar + "</td>" +
                "<td>" + lat.toFixed(5) + ", " + lng.toFixed(5) + "</td>" +
                "<td><b style='color:" + color + "'>" + estado + "</b></td>";
            cuerpoTabla.appendChild(tr);
        }

        // ============ ④ CREAR LA CONEXIÓN ============
        // puerto: paqueteservidor/Properties/launchSettings.json   ruta: MapHub en Program.cs
        const conexion = new signalR.HubConnectionBuilder()
            .withUrl("http://localhost:5117/paquetes")
            .withAutomaticReconnect()
            .build();

        // ============ ⑤ YO MANDO (invoke) ============
        // (nada: el cliente solo mira)

        // ============ ⑥ YO RECIBO (on) ============
        // los nombres son IGUALES a los del SendAsync del Hub

        // --- 1. Llegó un envío nuevo ---
        conexion.on("RecibirEnvio", function (origenLat, origenLng, destLat, destLng, precio, tipo) {
            contadorParadas = 0;
            cuerpoTabla.innerHTML = "";   // limpiar la tabla

            const origen = [origenLat, origenLng];
            const destino = [destLat, destLng];
            rutaCoordenadas = [origen];   // la ruta empieza solo con el origen

            L.marker(origen).addTo(mapSeg).bindPopup("<b>Origen (Salió de aquí)</b>").openPopup();
            L.marker(destino).addTo(mapSeg).bindPopup("<b>Destino Final</b>");

            mapSeg.setView(origen, 13);   // el mapa viaja al origen

            infoPaquete.innerHTML = "<b>Paquete en tránsito - Tipo: " + tipo + "</b>";
            agregarFilaTabla("Origen (Almacén)", origen[0], origen[1], "Pendiente");
        });

        // --- 2. Llegó una parada o la entrega ---
        conexion.on("RecibirActualizacion", function (lat, lng, estado) {
            rutaCoordenadas.push([lat, lng]);
            actualizarLinea();

            if (estado == "En ruta") {
                contadorParadas++;
                L.marker([lat, lng]).addTo(mapSeg).bindPopup("Parada " + contadorParadas);
                agregarFilaTabla("Parada " + contadorParadas, lat, lng, estado);
            } else {
                // "Entregado": no pongo pin, el destino ya tiene el suyo
                agregarFilaTabla("Destino Final", lat, lng, estado);
                infoPaquete.innerHTML = "<b>Paquete Entregado Exitosamente</b>";
            }
        });

        // ============ ⑦ ARRANCAR LA CONEXIÓN ============
        conexion.start()
            .then(() => console.log("conexion exitosa"))
            .catch(e => console.log("Error al conectar: " + e));
    </script>
</body>
</html>
