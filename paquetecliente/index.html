<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envíos y Seguimiento</title>
    <!-- Leaflet (mapa): los estilos van en el head -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        table, th, td { border: 1px solid black; }
    </style>
</head>
<body>
    <!-- ============ ① LO QUE SE VE ============ -->

    <h2>1. Crear Nuevo Envío</h2>
    <input type="text" id="txtPrecio" placeholder="Precio ($)">
    <select id="txtTipo">
        <option value="Ligero">Ligero</option>
        <option value="Pesado">Pesado</option>
        <option value="Frágil">Frágil</option>
    </select>
    <button id="btnEnviar">Registrar Envío</button>
    <p><b>Origen:</b> se toma tu ubicación. <b>Destino:</b> haz clic en el mapa.</p>
    <!-- el mapa NECESITA un alto, si no, no se ve -->
    <div id="mapaFormulario" style="height: 400px;"></div>

    <h2>2. Seguimiento</h2>
    <p id="infoPaquete"></p>
    <p>Clic en el mapa = agregar parada. Clic en el pin de destino = entregar.</p>
    <div id="mapaSeguimiento" style="height: 400px;"></div>

    <h3>Historial del Paquete</h3>
    <table>
        <tr>
            <th>Lugar</th>
            <th>Coordenadas (Lat, Lng)</th>
            <th>Estado</th>
        </tr>
        <tbody id="cuerpoTabla"></tbody>
    </table>

    <!-- ============ ② LA LIBRERÍA ============ -->
    <script src="signalr.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ============ ③ AGARRAR LOS ELEMENTOS (por su id) ============
        const txtPrecio = document.getElementById("txtPrecio");
        const txtTipo = document.getElementById("txtTipo");
        const btnEnviar = document.getElementById("btnEnviar");
        const infoPaquete = document.getElementById("infoPaquete");
        const cuerpoTabla = document.getElementById("cuerpoTabla");

        // variables: let porque van a cambiar
        let miLatitud = 0;          // origen (mi ubicación)
        let miLongitud = 0;
        let destinoLat = 0;         // destino (clic en el mapa del formulario)
        let destinoLng = 0;
        let marcadorDestino = null; // pin del destino en el mapa del formulario

        let rutaCoordenadas = [];      // los puntos de la ruta: [[lat, lng], [lat, lng], ...]
        let lineaRuta = null;          // la línea roja
        let destinoSeg = null;         // [lat, lng] del destino en el mapa de seguimiento
        let marcadorDestinoSeg = null; // pin del destino en el mapa de seguimiento
        let estadoActual = "Pendiente";
        let contadorParadas = 0;

        // --- MAPA DEL FORMULARIO --- centrado en Teziutlán: [latitud, longitud], zoom
        const mapForm = L.map("mapaFormulario").setView([19.8835847, -97.3934342], 13);

        // los "dibujos" del mapa (calles, ríos...). Sin esto se ve gris
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19
        }).addTo(mapForm);

        // Origen = mi ubicación (como el profe: GeoSuccess y GeoError)
        navigator.geolocation.getCurrentPosition(GeoSuccess, GeoError);

        function GeoSuccess(posicion) {
            miLatitud = posicion.coords.latitude;
            miLongitud = posicion.coords.longitude;
            L.marker([miLatitud, miLongitud]).addTo(mapForm).bindPopup("<b>Mi Origen</b>").openPopup();
            mapForm.setView([miLatitud, miLongitud], 14);
        }

        function GeoError(e) {
            alert("No se pudo obtener tu ubicación (¿le diste Permitir?)");
        }

        // Destino = clic en el mapa (como el onMapClick del profe)
        function onMapClick(e) {
            destinoLat = e.latlng.lat;
            destinoLng = e.latlng.lng;
            if (marcadorDestino != null) {
                marcadorDestino.remove();   // borra el destino anterior
            }
            marcadorDestino = L.marker([destinoLat, destinoLng]).addTo(mapForm).bindPopup("<b>Destino</b>").openPopup();
        }

        mapForm.on("click", onMapClick);

        // --- MAPA DE SEGUIMIENTO ---
        const mapSeg = L.map("mapaSeguimiento").setView([19.8835847, -97.3934342], 13);

        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19
        }).addTo(mapSeg);

        // Dibujar (o volver a dibujar) la línea roja de la ruta
        function actualizarLinea() {
            if (lineaRuta != null) {
                lineaRuta.remove();
            }
            lineaRuta = L.polyline(rutaCoordenadas, { color: "red" }).addTo(mapSeg);
        }

        // Agregar una fila a la tabla (igual que el <p> del chat, pero con <tr>). toFixed(5) = 5 decimales
        function agregarFilaTabla(lugar, lat, lng, estado) {
            const tr = document.createElement("tr");
            tr.innerHTML = "<td>" + lugar + "</td>" +
                "<td>" + lat.toFixed(5) + ", " + lng.toFixed(5) + "</td>" +
                "<td><b>" + estado + "</b></td>";
            cuerpoTabla.appendChild(tr);
        }

        // ============ ④ CREAR LA CONEXIÓN ============
        // puerto: paqueteservidor/Properties/launchSettings.json   ruta: MapHub en Program.cs
        const conexion = new signalR.HubConnectionBuilder()
            .withUrl("http://localhost:5117/paquetes")
            .withAutomaticReconnect()
            .build();

        // ============ ⑤ YO MANDO (invoke) ============

        // --- 1. Registrar el envío ---
        btnEnviar.addEventListener("click", async () => {
            if (miLatitud == 0) {
                alert("Todavía no tengo tu ubicación (¿le diste Permitir?)");
                return;
            }
            if (destinoLat == 0) {
                alert("Selecciona un destino en el mapa");
                return;
            }
            try {
                // el nombre "NuevoEnvio" es IGUAL al método del Hub
                await conexion.invoke("NuevoEnvio",
                    miLatitud,          // origenLat (double)
                    miLongitud,         // origenLng (double)
                    destinoLat,         // destLat   (double)
                    destinoLng,         // destLng   (double)
                    txtPrecio.value,    // precio    (string)
                    txtTipo.value);     // tipo      (string)
            } catch (error) {
                alert("error: " + error);
            }
        });

        // --- 2. Agregar parada: clic en el mapa de seguimiento ---
        async function onMapSegClick(e) {
            if (destinoSeg == null) {
                alert("Primero registra un envío");
                return;
            }
            if (estadoActual == "Entregado") {
                return;   // ya se entregó, ignorar clics
            }
            try {
                await conexion.invoke("ActualizarRuta", e.latlng.lat, e.latlng.lng, "En ruta");
            } catch (error) {
                alert("error: " + error);
            }
        }

        mapSeg.on("click", onMapSegClick);

        // --- 3. Entregar: clic en el pin de destino (el pin se crea en el on("RecibirEnvio")) ---
        async function EntregarPaquete() {
            if (estadoActual == "Entregado") {
                return;
            }
            try {
                await conexion.invoke("ActualizarRuta", destinoSeg[0], destinoSeg[1], "Entregado");
                alert("¡Paquete Entregado Exitosamente!");
            } catch (error) {
                alert("error: " + error);
            }
        }

        // ============ ⑥ YO RECIBO (on) ============
        // los nombres son IGUALES a los del SendAsync del Hub

        // --- 1. Llegó un envío nuevo ---
        conexion.on("RecibirEnvio", function (origenLat, origenLng, destLat, destLng, precio, tipo) {
            estadoActual = "Pendiente";
            contadorParadas = 0;
            cuerpoTabla.innerHTML = "";   // limpiar la tabla

            const origen = [origenLat, origenLng];
            destinoSeg = [destLat, destLng];
            rutaCoordenadas = [origen];   // la ruta empieza solo con el origen

            L.marker(origen).addTo(mapSeg).bindPopup("<b>Origen</b>");

            // el pin de destino: al darle clic se entrega. Si había uno de otro envío, lo borro
            if (marcadorDestinoSeg != null) {
                marcadorDestinoSeg.remove();
            }
            marcadorDestinoSeg = L.marker(destinoSeg).addTo(mapSeg).bindPopup("<b>¡Haz clic aquí para entregar!</b>").openPopup();
            marcadorDestinoSeg.on("click", EntregarPaquete);

            mapSeg.setView(origen, 13);   // el mapa viaja al origen

            infoPaquete.innerHTML = "<b>Paquete " + tipo + "</b> | Precio: $" + precio;
            agregarFilaTabla("Origen (Almacén)", origen[0], origen[1], estadoActual);
        });

        // --- 2. Llegó una parada o la entrega (aquí se dibuja, así lo ven TODAS las pestañas) ---
        conexion.on("RecibirActualizacion", function (lat, lng, estado) {
            estadoActual = estado;
            rutaCoordenadas.push([lat, lng]);
            actualizarLinea();

            if (estado == "En ruta") {
                contadorParadas++;
                L.marker([lat, lng]).addTo(mapSeg).bindPopup("Parada " + contadorParadas);
                agregarFilaTabla("Parada " + contadorParadas, lat, lng, estado);
            } else {
                // "Entregado": no pongo pin, el destino ya tiene el suyo
                agregarFilaTabla("Destino Final", lat, lng, estado);
            }
        });

        // ============ ⑦ ARRANCAR LA CONEXIÓN ============
        conexion.start()
    </script>
</body>
</html>
