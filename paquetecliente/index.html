<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Envío</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

    <h3>Formulario de Envío</h3>
    <a href="tabla.html">Tabla de envíos</a> | <a href="seguimiento.html">Seguimiento</a>
    <br><br>

    <label for="txtPrecio">Precio ($)</label>
    <input type="number" id="txtPrecio">
    <br>
    <label for="txtTipo">Tipo de Paquete</label>
    <select id="txtTipo">
        <option value="Ligero">Ligero</option>
        <option value="Pesado">Pesado</option>
        <option value="Frágil">Frágil</option>
    </select>
    <br>
    <label for="txtFechaEntrega">Fecha de entrega</label>
    <input type="text" id="txtFechaEntrega" placeholder="dd/mm/aaaa">
    <br>
    <button id="btnEnviar">Enviar</button>

    <p id="lblOrigen"><b>Origen:</b> buscando tu ubicación...</p>
    <p id="lblDestino"><b>Destino:</b> haz clic en el mapa</p>
    <div id="contenedor"></div>

    <div id="mapaFormulario" style="height: 400px;"></div>

    <script src="signalr.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const txtPrecio = document.getElementById("txtPrecio");
        const txtTipo = document.getElementById("txtTipo");
        const txtFechaEntrega = document.getElementById("txtFechaEntrega");
        const btnEnviar = document.getElementById("btnEnviar");
        const lblOrigen = document.getElementById("lblOrigen");
        const lblDestino = document.getElementById("lblDestino");
        const contenedor = document.getElementById("contenedor");

        let miLatitud = 0;
        let miLongitud = 0;
        let destinoLat = 0;
        let destinoLng = 0;
        let marcadorDestino = null;

        let paquete = JSON.parse(localStorage.getItem("paquete"));

        function MostrarPaquete() {
            if (localStorage.getItem("paquete")) {
                contenedor.innerHTML = "<b>Paquete registrado:</b> " + paquete.tipo +
                    " | Entrega: " + paquete.fechaEntrega +
                    " | Estado: " + paquete.estado +
                    " | Creado: " + paquete.fechaCreacion;
            } else {
                contenedor.innerHTML = "No hay envíos registrados";
            }
        }

        MostrarPaquete();

        const mapForm = L.map("mapaFormulario").setView([23.6, -102.5], 5);

        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19
        }).addTo(mapForm);

        function ObtenerUbicacion() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(GeoSuccess, GeoError);
            } else {
                lblOrigen.innerHTML = "<b>Origen:</b> tu navegador no tiene geolocalización";
            }
        }

        function GeoSuccess(posicion) {
            miLatitud = posicion.coords.latitude;
            miLongitud = posicion.coords.longitude;
            L.marker([miLatitud, miLongitud]).addTo(mapForm).bindPopup("<b>Origen</b>").openPopup();
            lblOrigen.innerHTML = "<b>Origen:</b> " + miLatitud.toFixed(4) + ", " + miLongitud.toFixed(4);
        }

        function GeoError(e) {
            switch (e.code) {
                case e.PERMISSION_DENIED:
                    lblOrigen.innerHTML = "<b>Origen:</b> no diste permiso de ubicación (clic en el candado → Ubicación → Permitir)";
                    break;
                case e.POSITION_UNAVAILABLE:
                    lblOrigen.innerHTML = "<b>Origen:</b> ubicación no disponible";
                    break;
                case e.TIMEOUT:
                    lblOrigen.innerHTML = "<b>Origen:</b> tiempo de espera terminado, recarga la página";
                    break;
            }
        }

        ObtenerUbicacion();

        function onMapClick(e) {
            destinoLat = e.latlng.lat;
            destinoLng = e.latlng.lng;
            if (marcadorDestino != null) {
                marcadorDestino.remove();
            }
            marcadorDestino = L.marker([destinoLat, destinoLng]).addTo(mapForm).bindPopup("<b>Destino</b>").openPopup();
            lblDestino.innerHTML = "<b>Destino:</b> " + destinoLat.toFixed(4) + ", " + destinoLng.toFixed(4);
        }

        mapForm.on("click", onMapClick);

        const conexion = new signalR.HubConnectionBuilder()
            .withUrl("http://localhost:5117/paquetes")
            .withAutomaticReconnect()
            .build();

        btnEnviar.addEventListener("click", async () => {
            if (miLatitud == 0) {
                alert("Todavía no tengo tu ubicación (¿le diste Permitir?)");
                return;
            }
            if (destinoLat == 0) {
                alert("Selecciona un destino en el mapa");
                return;
            }
            if (txtPrecio.value == "") {
                alert("Escribe el precio (solo números)");
                return;
            }
            if (txtFechaEntrega.value == "") {
                alert("Escribe la fecha de entrega");
                return;
            }
            if (localStorage.getItem("paquete")) {
                if (!confirm("Ya hay un paquete registrado. ¿Quieres reemplazarlo?")) {
                    return;
                }
            }
            try {
                await conexion.invoke("NuevoEnvio",
                    miLatitud,
                    miLongitud,
                    destinoLat,
                    destinoLng,
                    txtPrecio.value,
                    txtTipo.value,
                    txtFechaEntrega.value);
            } catch (error) {
                alert("error: " + error);
            }
        });

        conexion.on("RecibirEnvio", function (origenLat, origenLng, destLat, destLng, precio, tipo, fechaEntrega, fechaCreacion) {
            paquete = {
                id: 1,
                origen: { lat: origenLat, lng: origenLng },
                destino: { lat: destLat, lng: destLng },
                precio: precio,
                tipo: tipo,
                estado: "Recibido",
                fechaEntrega: fechaEntrega,
                fechaCreacion: fechaCreacion,
                ruta: [],
                historial: [ { estado: "Recibido", fecha: fechaCreacion } ]
            };
            localStorage.setItem("paquete", JSON.stringify(paquete));
            MostrarPaquete();
        });

        conexion.start()
            .then(() => console.log("conexion exitosa"))
            .catch(e => console.log("Error al conectar: " + e));
    </script>
</body>
</html>
