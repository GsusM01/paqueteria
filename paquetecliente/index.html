<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Envío</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body { font-family: Arial, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; background-color: #f4f6f8; color: #333; }
        h3, h4 { color: #0056b3; }
        a { color: #0056b3; }
        label { display: inline-block; width: 140px; }
        input, select, button { padding: 6px; margin: 4px 0; }
        button { background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        table { border-collapse: collapse; background-color: white; }
        th, td { border: 1px solid #ccc; padding: 8px; }
        th { background-color: #0056b3; color: white; }
        #mapaFormulario, #mapaRuta, #mapaSeguimiento { border: 2px solid #0056b3; border-radius: 6px; }
    </style>
</head>
<body>

    <h3>Formulario de Envío</h3>
    <a href="tabla.html">Tabla de envíos</a> | <a href="seguimiento.html">Seguimiento</a>
    <br><br>

    <label for="">Precio ($)</label>
    <input type="number" id="txtPrecio">
    <br>
    <label for="">Tipo de Paquete</label>
    <select id="txtTipo">
        <option value="Ligero">Ligero</option>
        <option value="Pesado">Pesado</option>
        <option value="Frágil">Frágil</option>
    </select>
    <br>
    <label for="">Fecha de entrega</label>
    <input type="text" id="txtFechaEntrega" placeholder="dd/mm/aaaa">
    <br>
    <button id="btnEnviar">Enviar</button>

    <p id="lblOrigen"><b>Origen:</b> buscando tu ubicación...</p>
    <p id="lblDestino"><b>Destino:</b> haz clic en el mapa</p>
    <div id="contenedor"></div>

    <div id="mapaFormulario" style="height: 400px;"></div>

    <script src="signalr.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const txtPrecio = document.getElementById("txtPrecio");
        const txtTipo = document.getElementById("txtTipo");
        const txtFechaEntrega = document.getElementById("txtFechaEntrega");
        const btnEnviar = document.getElementById("btnEnviar");
        const lblOrigen = document.getElementById("lblOrigen");
        const lblDestino = document.getElementById("lblDestino");
        const contenedor = document.getElementById("contenedor");

        let miLatitud = 0;
        let miLongitud = 0;
        let destinoLat = 0;
        let destinoLng = 0;
        let marcadorDestino = null;
        let origenNombre = "";
        let destinoNombre = "";

        let paquete = JSON.parse(localStorage.getItem("paquete"));

        function MostrarPaquete() {
            if (localStorage.getItem("paquete")) {
                contenedor.innerHTML = "<b>Paquete registrado:</b> " + paquete.origen.nombre + " → " + paquete.destino.nombre +
                    " | " + paquete.tipo +
                    " | Entrega: " + paquete.fechaEntrega +
                    " | Estado: " + paquete.estado +
                    " | Creado: " + paquete.fechaCreacion;
            } else {
                contenedor.innerHTML = "No hay envíos registrados";
            }
        }

        MostrarPaquete();

        const mapForm = L.map("mapaFormulario").setView([23.6, -102.5], 5);

        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19
        }).addTo(mapForm);

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async pos => {
                miLatitud = pos.coords.latitude;
                miLongitud = pos.coords.longitude;
                L.marker([miLatitud, miLongitud]).addTo(mapForm).bindPopup("<b>Origen</b>").openPopup();
                lblOrigen.innerHTML = "<b>Origen:</b> buscando el estado...";
                try {
                    const respuesta = await fetch("https://nominatim.openstreetmap.org/reverse?format=json&accept-language=es&lat=" + miLatitud + "&lon=" + miLongitud);
                    const datos = await respuesta.json();
                    origenNombre = datos.address.state;
                } catch (error) {
                    origenNombre = "Sin estado";
                }
                lblOrigen.innerHTML = "<b>Origen:</b> " + origenNombre;
            });
        }

        async function onMapClick(e) {
            destinoLat = e.latlng.lat;
            destinoLng = e.latlng.lng;
            destinoNombre = "";
            if (marcadorDestino != null) {
                marcadorDestino.remove();
            }
            marcadorDestino = L.marker([destinoLat, destinoLng]).addTo(mapForm).bindPopup("<b>Destino</b>").openPopup();
            lblDestino.innerHTML = "<b>Destino:</b> buscando el estado...";
            try {
                const respuesta = await fetch("https://nominatim.openstreetmap.org/reverse?format=json&accept-language=es&lat=" + destinoLat + "&lon=" + destinoLng);
                const datos = await respuesta.json();
                destinoNombre = datos.address.state;
            } catch (error) {
                destinoNombre = "Sin estado";
            }
            lblDestino.innerHTML = "<b>Destino:</b> " + destinoNombre;
        }

        mapForm.on("click", onMapClick);

        const conexion = new signalR.HubConnectionBuilder()
            .withUrl("https://paqueteria-5jx7.onrender.com/paquetes")
            .withAutomaticReconnect()
            .build();

        btnEnviar.addEventListener("click", async () => {
            if (miLatitud == 0) {
                alert("No hay ubicacion");
                return;
            }
            if (destinoLat == 0) {
                alert("Tienes que seleccionar el destino");
                return;
            }
            if (origenNombre == "") {
                alert("Buscando nombre del estado para origen");
                return;
            }
            if (destinoNombre == "") {
                alert("Buscando nombre del estado para destino");
                return;
            }
            if (txtPrecio.value == "") {
                alert("Escribe el precio");
                return;
            }
            if (txtFechaEntrega.value == "") {
                alert("Escribe la fecha de entrega");
                return;
            }
            if (localStorage.getItem("paquete")) {
                if (!confirm("Ya hay un paquete registrado")) {
                    return;
                }
            }
            try {
                await conexion.invoke("NuevoEnvio",
                    miLatitud,
                    miLongitud,
                    destinoLat,
                    destinoLng,
                    txtPrecio.value,
                    txtTipo.value,
                    txtFechaEntrega.value,
                    origenNombre,
                    destinoNombre);
            } catch (error) {
                alert("error: " + error);
            }
        });

        conexion.on("RecibirEnvio", function (origenLat, origenLng, destLat, destLng, precio, tipo, fechaEntrega, fechaCreacion, origenNombre, destinoNombre) {
            paquete = {
                id: 1,
                origen: { lat: origenLat, lng: origenLng, nombre: origenNombre },
                destino: { lat: destLat, lng: destLng, nombre: destinoNombre },
                precio: precio,
                tipo: tipo,
                estado: "Recibido",
                fechaEntrega: fechaEntrega,
                fechaCreacion: fechaCreacion,
                ruta: [],
                historial: [ { estado: "Recibido", fecha: fechaCreacion } ]
            };
            localStorage.setItem("paquete", JSON.stringify(paquete));
            MostrarPaquete();
        });

        conexion.start()
            .then(() => console.log("conexion exitosa"))
            .catch(e => console.log("Error al conectar: " + e));
    </script>
</body>
</html>
