<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body { font-family: Arial, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; background-color: #f4f6f8; color: #333; }
        h3, h4 { color: #0056b3; }
        a { color: #0056b3; }
        label { display: inline-block; width: 140px; }
        input, select, button { padding: 6px; margin: 4px 0; }
        button { background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        table { border-collapse: collapse; background-color: white; }
        th, td { border: 1px solid #ccc; padding: 8px; }
        th { background-color: #0056b3; color: white; }
        #mapaFormulario, #mapaRuta, #mapaSeguimiento { border: 2px solid #0056b3; border-radius: 6px; }
    </style>
</head>
<body>

    <h3>Rastreo de tu Paquete</h3>
    <a href="index.html">Formulario</a> | <a href="tabla.html">Tabla de envíos</a>
    <br><br>

    <p id="infoPaquete"></p>

    <div id="mapaSeguimiento" style="height: 500px;"></div>

    <h4>Puntos de la ruta</h4>
    <div id="contenedorRuta"></div>

    <h4>Historial de estados</h4>
    <div id="contenedorHistorial"></div>

    <script src="signalr.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const infoPaquete = document.getElementById("infoPaquete");
        const contenedorRuta = document.getElementById("contenedorRuta");
        const contenedorHistorial = document.getElementById("contenedorHistorial");

        let marcadores = [];
        let lineaRuta = null;

        let paquete = JSON.parse(localStorage.getItem("paquete"));

        const mapSeg = L.map("mapaSeguimiento").setView([23.6, -102.5], 5);

        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19
        }).addTo(mapSeg);

        function DibujarRuta() {
            marcadores.forEach(marcador => {
                marcador.remove();
            });
            marcadores = [];
            if (lineaRuta != null) {
                lineaRuta.remove();
                lineaRuta = null;
            }
            if (paquete == null) {
                return;
            }

            marcadores.push(L.marker([paquete.origen.lat, paquete.origen.lng]).addTo(mapSeg).bindPopup("<b>Origen:</b> " + paquete.origen.nombre));
            marcadores.push(L.marker([paquete.destino.lat, paquete.destino.lng]).addTo(mapSeg).bindPopup("<b>Destino:</b> " + paquete.destino.nombre));

            const puntos = [[paquete.origen.lat, paquete.origen.lng]];
            let n = 0;
            paquete.ruta.forEach(punto => {
                n++;
                marcadores.push(L.marker([punto.lat, punto.lng]).addTo(mapSeg).bindPopup("<b>Punto " + n + ":</b> " + punto.nombre + "<br>" + punto.fecha));
                puntos.push([punto.lat, punto.lng]);
            });
            if (paquete.estado == "Entregado") {
                puntos.push([paquete.destino.lat, paquete.destino.lng]);
            }
            lineaRuta = L.polyline(puntos, { color: "blue" }).addTo(mapSeg);
        }

        function MostrarPaquete() {
            contenedorRuta.innerHTML = "";
            contenedorHistorial.innerHTML = "";
            if (localStorage.getItem("paquete")) {
                let color = "black";
                if (paquete.estado == "Entregado") {
                    color = "green";
                }
                infoPaquete.innerHTML = "<b>Paquete " + paquete.tipo + "</b>" +
                    " | De <b>" + paquete.origen.nombre + "</b> a <b>" + paquete.destino.nombre + "</b>" +
                    " | Estado: <b style='color:" + color + "'>" + paquete.estado + "</b>" +
                    " | Fecha de entrega: <b>" + paquete.fechaEntrega + "</b>";

                let n = 0;
                paquete.ruta.forEach(punto => {
                    n++;
                    const p = document.createElement("p");
                    p.innerHTML = "Punto " + n + ": <b>" + punto.nombre + "</b> (" + punto.fecha + ")";
                    contenedorRuta.appendChild(p);
                });
                if (n == 0) {
                    contenedorRuta.innerHTML = "Todavía no hay puntos";
                }

                paquete.historial.forEach(cambio => {
                    const p = document.createElement("p");
                    p.innerHTML = "<b>" + cambio.estado + "</b> - " + cambio.fecha;
                    contenedorHistorial.appendChild(p);
                });
            } else {
                infoPaquete.innerHTML = "No hay envíos registrados";
            }
            DibujarRuta();
        }

        MostrarPaquete();

        const conexion = new signalR.HubConnectionBuilder()
            .withUrl("https://paqueteria-5jx7.onrender.com/paquetes")
            .withAutomaticReconnect()
            .build();

        conexion.on("RecibirEnvio", function (origenLat, origenLng, destLat, destLng, precio, tipo, fechaEntrega, fechaCreacion, origenNombre, destinoNombre) {
            paquete = {
                id: 1,
                origen: { lat: origenLat, lng: origenLng, nombre: origenNombre },
                destino: { lat: destLat, lng: destLng, nombre: destinoNombre },
                precio: precio,
                tipo: tipo,
                estado: "Recibido",
                fechaEntrega: fechaEntrega,
                fechaCreacion: fechaCreacion,
                ruta: [],
                historial: [ { estado: "Recibido", fecha: fechaCreacion } ]
            };
            localStorage.setItem("paquete", JSON.stringify(paquete));
            MostrarPaquete();
        });

        conexion.on("RecibirActualizacion", function (lat, lng, fecha, nombre) {
            if (paquete == null) {
                return;
            }
            if (paquete.estado == "Entregado") {
                return;
            }
            paquete.ruta.push({ lat: lat, lng: lng, fecha: fecha, nombre: nombre });
            localStorage.setItem("paquete", JSON.stringify(paquete));
            MostrarPaquete();
        });

        conexion.on("EstadoCambiado", function (estado, fecha) {
            if (paquete == null) {
                return;
            }
            if (paquete.estado == "Entregado") {
                return;
            }
            paquete.estado = estado;
            paquete.historial.push({ estado: estado, fecha: fecha });
            localStorage.setItem("paquete", JSON.stringify(paquete));
            MostrarPaquete();
        });

        conexion.start()
            .then(() => console.log("conexion exitosa"))
            .catch(e => console.log("Error al conectar: " + e));
    </script>
</body>
</html>
